<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>ミルモノ - 不気味かわいい育成ペット</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- デバイス外枠 -->
    <div class="device-frame">
        <!-- 液晶画面 -->
        <div class="lcd-screen">
            <!-- ステータスアイコン -->
            <div class="status-icons">
                <span id="icon-hunger" class="icon hidden" title="空腹">🍽</span>
                <span id="icon-energy" class="icon hidden" title="元気不足">💤</span>
                <span id="icon-mood" class="icon hidden" title="きげん">😢</span>
                <span id="icon-clean" class="icon hidden" title="汚れ">💩</span>
                <span id="icon-sick" class="icon hidden" title="体調不良">🤒</span>
            </div>

            <!-- ペット表示エリア -->
            <div class="pet-area">
                <canvas id="pet-canvas" width="300" height="200"></canvas>
                <div id="pet-name" class="pet-name">カゲダマ</div>
                <div id="pet-info" class="pet-info">年齢: 0分</div>
            </div>

            <!-- メッセージエリア -->
            <div id="message-area" class="message-area"></div>
        </div>

        <!-- ボタンエリア -->
        <div class="button-area">
            <button class="main-btn" id="btn-feed">
                <span class="btn-icon">🍚</span>
                <span class="btn-text">ごはん</span>
            </button>
            <button class="main-btn" id="btn-play">
                <span class="btn-icon">🎮</span>
                <span class="btn-text">あそぶ</span>
            </button>
            <button class="main-btn" id="btn-clean">
                <span class="btn-icon">✨</span>
                <span class="btn-text">そうじ</span>
            </button>
            <button class="main-btn" id="btn-menu">
                <span class="btn-icon">📋</span>
                <span class="btn-text">メニュー</span>
            </button>
        </div>
    </div>

    <!-- モーダル：ごはん選択 -->
    <div id="modal-feed" class="modal">
        <div class="modal-content">
            <h2>ごはんをあげる</h2>
            <div id="food-list" class="item-list"></div>
            <button class="modal-btn close-btn">もどる</button>
        </div>
    </div>

    <!-- モーダル：ミニゲーム -->
    <div id="modal-game" class="modal">
        <div class="modal-content">
            <h2>あそぼう</h2>
            <div class="game-area">
                <p>バーが真ん中で止めてね！</p>
                <canvas id="game-canvas" width="280" height="100"></canvas>
                <button id="game-tap-btn" class="game-btn">タップ！</button>
                <div id="game-result" class="game-result"></div>
            </div>
            <button class="modal-btn close-btn">もどる</button>
        </div>
    </div>

    <!-- モーダル：メニュー -->
    <div id="modal-menu" class="modal">
        <div class="modal-content menu-content">
            <h2>メニュー</h2>

            <div class="menu-section">
                <h3>ステータス</h3>
                <div class="status-list">
                    <div class="stat-row">
                        <span>空腹:</span>
                        <div class="stat-bar"><div id="bar-hunger" class="bar-fill"></div></div>
                        <span id="val-hunger">0</span>
                    </div>
                    <div class="stat-row">
                        <span>元気:</span>
                        <div class="stat-bar"><div id="bar-energy" class="bar-fill"></div></div>
                        <span id="val-energy">0</span>
                    </div>
                    <div class="stat-row">
                        <span>きげん:</span>
                        <div class="stat-bar"><div id="bar-mood" class="bar-fill"></div></div>
                        <span id="val-mood">0</span>
                    </div>
                    <div class="stat-row">
                        <span>清潔:</span>
                        <div class="stat-bar"><div id="bar-clean" class="bar-fill"></div></div>
                        <span id="val-clean">0</span>
                    </div>
                    <div class="stat-row">
                        <span>なつき:</span>
                        <div class="stat-bar"><div id="bar-affection" class="bar-fill"></div></div>
                        <span id="val-affection">0</span>
                    </div>
                </div>
                <div class="info-text">
                    <p>名前: <span id="menu-name">-</span></p>
                    <p>年齢: <span id="menu-age">0</span>分</p>
                    <p>ケア傾向: <span id="menu-care">-</span></p>
                </div>
            </div>

            <div class="menu-section">
                <h3>ケア</h3>
                <button id="btn-medicine" class="menu-btn">ヒカリのきりを使う</button>
            </div>

            <div class="menu-section">
                <h3>設定</h3>
                <div class="setting-row">
                    <label>音量:</label>
                    <input type="range" id="volume" min="0" max="100" value="50">
                    <span id="volume-text">50%</span>
                </div>
                <button id="btn-mute" class="menu-btn">ミュート: OFF</button>
            </div>

            <div class="menu-section">
                <button id="btn-reset" class="danger-btn">リセット（最初から）</button>
            </div>

            <button class="modal-btn close-btn">もどる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
